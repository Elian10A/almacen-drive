<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Drive</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#1f2937">
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f3f4f6;color:#111827}
header{background:#1f2937;color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
main{padding:12px;max-width:900px;margin:auto}
.card{background:#fff;border-radius:8px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px #0002}
button{padding:8px 12px;border:0;border-radius:6px;background:#2563eb;color:#fff;cursor:pointer;margin:2px 6px 2px 0}
button.sec{background:#6b7280}
.bar{height:10px;background:#e5e7eb;border-radius:5px;overflow:hidden}
.bar>div{height:100%;background:#2563eb}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px;border-bottom:1px solid #e5e7eb;text-align:left}
input[type=search]{width:100%;padding:8px;box-sizing:border-box;font-size:16px}
.muted{color:#6b7280;font-size:13px}
.name{word-break:break-word}
</style>
</head>
<body>
<header><strong>Mi Drive</strong></header>
<main>
  <div class="card">
    <div id="quota" class="muted">No conectado.</div>
    <div class="bar" style="margin:8px 0"><div id="bar" style="width:0%"></div></div>
    <button id="btnConnect" onclick="connect()">Conectar Google Drive</button>
    <button id="btnLogout" class="sec" onclick="logout()" style="display:none">Desconectar</button>
  </div>
  <div class="card">
    <h3 style="margin-top:0">Subir archivo</h3>
    <input type="file" id="file">
    <button onclick="uploadFile()">Subir</button>
    <div id="uploadStatus" class="muted"></div>
  </div>
  <div class="card">
    <input type="search" id="search" placeholder="Buscar archivos" oninput="render()">
    <div id="status" class="muted" style="margin:8px 0"></div>
    <table>
      <thead><tr><th>Nombre</th><th>Tamaño</th><th></th></tr></thead>
      <tbody id="files"></tbody>
    </table>
  </div>
</main>
<script src="https://accounts.google.com/gsi/client" async></script>
<script src="app.js"></script>
</body>
</html>
